    <h1>What's new</h1>
    <div class="meta">Every Zero-Music release, newest first. The app updates itself, so you're probably already on the latest.</div>

  <script>
    (function () {
      function esc(text) { return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
      function inline(text) { return esc(text).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }
      // Release notes are plain text with "- " bullets (two spaces deeper for sub-points) and **bold**.
      function render(notes) {
        var out = "", depth = 0;
        notes.split("\n").forEach(function (line) {
          var bullet = line.match(/^(\s*)[-*]\s+(.*)$/);
          if (bullet) {
            var level = bullet[1].length >= 2 ? 2 : 1;
            while (depth < level) { out += "<ul>"; depth++; }
            while (depth > level) { out += "</ul>"; depth--; }
            out += "<li>" + inline(bullet[2]) + "</li>";
          } else if (line.trim()) {
            while (depth > 0) { out += "</ul>"; depth--; }
            out += "<p>" + inline(line.trim()) + "</p>";
          }
        });
        while (depth > 0) { out += "</ul>"; depth--; }
        return out;
      }
      var box = document.getElementById("releases");
      fetch("/zero-music/releases.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (releases) {
        box.innerHTML = releases.map(function (release, i) {
          var date = new Date(release.date).toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
          return '<article class="card release"><h2>Version ' + esc(release.version) + (i === 0 ? ' <span class="badge">Latest</span>' : "") +
            '</h2><div class="date">' + date + "</div>" + render(release.notes) + "</article>";
        }).join("");
      }).catch(function () {
        box.innerHTML = "<p>Couldn't load the release notes. Check your connection and reload.</p>";
      });
    })();
  </script>
